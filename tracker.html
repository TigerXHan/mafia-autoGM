<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111319">
  <meta name="description" content="A touchscreen moderator console for running Mafia nights, deaths, and voting.">
  <title>Mafia Night Runner</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23111319'/%3E%3Cpath d='M12 43 20 17l12 15 12-15 8 26Z' fill='%23d8ae5e'/%3E%3Ccircle cx='32' cy='42' r='6' fill='%23a43a3a'/%3E%3C/svg%3E">
  <style>
    :root {
      color-scheme: dark;
      --ink: #111319;
      --panel: #1a1d25;
      --panel-2: #232733;
      --line: #363b49;
      --text: #f6f1e8;
      --muted: #aaa69e;
      --gold: #d8ae5e;
      --gold-2: #f2d28f;
      --blood: #a43a3a;
      --blood-2: #d65b55;
      --good: #63b08c;
      --blue: #6e92c7;
      --shadow: 0 18px 60px rgba(0,0,0,.32);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; background: var(--ink); color: var(--text); }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      background:
        radial-gradient(circle at 18% -8%, rgba(164,58,58,.2), transparent 34rem),
        radial-gradient(circle at 95% 10%, rgba(216,174,94,.12), transparent 28rem),
        var(--ink);
      font-size: 17px;
      line-height: 1.5;
      -webkit-tap-highlight-color: transparent;
    }
    button, input { font: inherit; }
    button { touch-action: manipulation; }
    .shell { width: min(100%, 1050px); min-height: 100dvh; margin: 0 auto; padding: max(18px, env(safe-area-inset-top)) 22px max(26px, env(safe-area-inset-bottom)); }
    .topbar { min-height: 58px; display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 18px; }
    .status-pill { padding: 8px 13px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); font-size: .88rem; white-space: nowrap; }
    .screen.is-entering { animation: rise .22s ease-out; }
    @keyframes rise { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: translateY(0); } }
    .eyebrow { margin: 0 0 8px; color: var(--gold); font-weight: 800; text-transform: uppercase; letter-spacing: .13em; font-size: .76rem; }
    h1, h2, h3 { margin: 0; line-height: 1.08; letter-spacing: -.025em; }
    h1 { font-family: Georgia, "Times New Roman", serif; font-size: clamp(2.35rem, 7vw, 4.8rem); font-weight: 700; }
    h2 { font-family: Georgia, "Times New Roman", serif; font-size: clamp(1.9rem, 5vw, 3.25rem); }
    h3 { font-size: 1.15rem; }
    .lead { max-width: 700px; margin: 16px 0 0; color: #cbc6bd; font-size: clamp(1rem, 2.4vw, 1.2rem); }
    .hero { padding: clamp(25px, 6vw, 58px) 0 26px; }
    .panel { margin-top: 22px; padding: clamp(19px, 4vw, 30px); border: 1px solid var(--line); border-radius: 24px; background: linear-gradient(155deg, rgba(35,39,51,.94), rgba(24,27,35,.96)); box-shadow: var(--shadow); }
    .panel.soft { box-shadow: none; background: rgba(26,29,37,.72); }
    .panel.danger { border-color: rgba(164,58,58,.6); }
    .rule { height: 1px; background: var(--line); margin: 22px 0; }
    .stack { display: grid; gap: 14px; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 13px; }
    .grid.three { grid-template-columns: repeat(3, minmax(0,1fr)); }
    .choice-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 13px; margin-top: 22px; }
    .btn { min-height: 64px; border: 1px solid var(--line); border-radius: 17px; padding: 14px 18px; background: var(--panel-2); color: var(--text); font-weight: 800; cursor: pointer; transition: transform .08s ease, border-color .15s ease, background .15s ease; }
    .btn:active { transform: scale(.985); }
    .btn:hover, .btn:focus-visible { border-color: var(--gold); outline: none; }
    .btn.primary { min-height: 72px; color: #17130c; background: linear-gradient(180deg, var(--gold-2), var(--gold)); border-color: var(--gold-2); font-size: 1.05rem; }
    .btn.danger { background: rgba(164,58,58,.2); border-color: rgba(214,91,85,.65); color: #ffd7d4; }
    .btn.ghost { background: transparent; color: var(--muted); }
    .btn.selected { border-color: var(--gold-2); background: rgba(216,174,94,.16); box-shadow: inset 0 0 0 1px var(--gold); }
    .btn:disabled { opacity: .42; cursor: not-allowed; }
    .btn small { display: block; margin-top: 4px; color: var(--muted); font-weight: 600; }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 13px; margin-top: 22px; }
    .actions .wide { grid-column: 1 / -1; }
    .field { display: grid; gap: 7px; }
    .field label { color: var(--muted); font-size: .86rem; font-weight: 750; }
    .field input { min-height: 58px; width: 100%; border: 1px solid var(--line); border-radius: 14px; padding: 12px 15px; background: #14171e; color: var(--text); outline: none; }
    .field input:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(216,174,94,.12); }
    .stepper { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 15px; border: 1px solid var(--line); border-radius: 17px; background: #161920; }
    .stepper strong { font-size: 1.07rem; }
    .stepper-controls { display: flex; align-items: center; gap: 10px; }
    .stepper-controls button { width: 52px; height: 52px; border: 1px solid var(--line); border-radius: 15px; background: var(--panel-2); color: var(--text); font-size: 1.45rem; font-weight: 800; }
    .stepper-controls output { min-width: 32px; text-align: center; font-size: 1.25rem; font-weight: 850; }
    .toggle { width: 62px; height: 36px; padding: 3px; border: 1px solid var(--line); border-radius: 999px; background: #12151b; }
    .toggle span { display: block; width: 28px; height: 28px; border-radius: 50%; background: var(--muted); transition: transform .2s ease, background .2s ease; }
    .toggle.on span { transform: translateX(26px); background: var(--gold); }
    .name-list { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; }
    .player-setup { display: grid; grid-template-columns: minmax(0,1fr) 112px; gap: 10px; align-items: end; padding: 12px; border: 1px solid var(--line); border-radius: 17px; background: rgba(16,18,24,.54); }
    .card-button { min-height: 58px; border: 1px solid var(--line); border-radius: 14px; background: var(--panel-2); color: var(--text); font-size: 1.35rem; font-weight: 900; cursor: pointer; }
    .card-button.empty { color: var(--muted); font-size: .9rem; }
    .playing-card { font-family: Georgia, "Times New Roman", serif; font-weight: 900; letter-spacing: .02em; }
    .playing-card.red { color: #ef7670; }
    .card-picker { display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); gap: 10px; margin-top: 20px; }
    .card-choice { min-height: 68px; border: 1px solid var(--line); border-radius: 15px; background: var(--panel-2); color: var(--text); font-size: 1.45rem; cursor: pointer; }
    .card-choice.selected { border-color: var(--gold-2); background: rgba(216,174,94,.18); box-shadow: inset 0 0 0 1px var(--gold); }
    .card-choice:disabled { opacity: .25; cursor: not-allowed; }
    .setup-summary { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
    .table-controls { display: grid; grid-template-columns: 1fr 1fr auto; gap: 12px; align-items: stretch; margin-top: 18px; }
    .table-map { position: relative; height: clamp(440px,62dvh,620px); margin: 24px 42px 8px; border: 1px solid rgba(216,174,94,.16); border-radius: 28px; background: radial-gradient(circle at 50% 50%,rgba(216,174,94,.06),transparent 58%); }
    .table-map.selection-map { height: clamp(420px,56dvh,540px); margin-top: 18px; }
    .table-surface { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); border: 2px solid rgba(216,174,94,.48); border-radius: 24px; background: linear-gradient(145deg,#302820,#17191f); box-shadow: inset 0 0 0 8px rgba(216,174,94,.035),0 20px 42px rgba(0,0,0,.28); display: grid; place-items: center; color: rgba(242,210,143,.55); font: 800 .78rem Inter,ui-sans-serif,system-ui,sans-serif; letter-spacing: .16em; text-transform: uppercase; }
    .table-prompt { padding: 10px; text-align: center; }
    .table-confirm { width: min(88%,250px); display: grid; gap: 9px; padding: 8px; text-align: center; letter-spacing: normal; text-transform: none; }
    .table-confirm-name { color: var(--text); font-size: clamp(.9rem,2.1vw,1.15rem); font-weight: 900; line-height: 1.12; overflow-wrap: anywhere; }
    .table-confirm-actions { display: grid; grid-template-columns: minmax(0,.8fr) minmax(0,1.2fr); gap: 7px; }
    .table-confirm-actions button { min-height: 42px; padding: 7px 9px; border: 1px solid var(--line); border-radius: 10px; background: rgba(255,255,255,.055); color: var(--muted); font: 850 clamp(.7rem,1.7vw,.84rem) Inter,ui-sans-serif,system-ui,sans-serif; cursor: pointer; }
    .table-confirm-actions .confirm-player { border-color: var(--gold-2); background: linear-gradient(135deg,var(--gold-2),var(--gold)); color: #17130c; }
    .seat-button { position: absolute; transform: translate(-50%,-50%); width: clamp(68px,9vw,88px); aspect-ratio: 1; padding: 7px; border: 1px solid var(--line); border-radius: 15px; background: linear-gradient(160deg,#2a2f3c,#1b1e27); color: var(--text); font-weight: 850; line-height: 1.12; overflow: hidden; cursor: pointer; box-shadow: 0 8px 22px rgba(0,0,0,.3); touch-action: none; }
    .seat-button .seat-name { display: block; overflow-wrap: anywhere; }
    .seat-button small { display: block; margin-top: 5px; color: var(--muted); font-size: .68rem; font-weight: 750; }
    .seat-button.selected { border-color: var(--gold-2); background: rgba(216,174,94,.2); box-shadow: 0 0 0 2px rgba(216,174,94,.36),0 8px 22px rgba(0,0,0,.3); }
    .seat-button:disabled, .seat-button.unavailable { opacity: .38; filter: grayscale(.9); cursor: not-allowed; box-shadow: none; }
    .seat-button.dragging { z-index: 5; border-color: var(--gold-2); transform: translate(-50%,-50%) scale(1.06); }
    .layout-hint { margin: 12px 0 0; color: var(--muted); text-align: center; font-size: .9rem; }
    .role-settings { margin-top: 20px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 17px; background: #161920; }
    .role-settings summary { min-height: 32px; font-weight: 800; cursor: pointer; }
    .role-settings p { color: var(--muted); font-size: .9rem; }
    .role-settings .grid { align-items: start; }
    .role-settings fieldset { min-width: 0; margin: 0; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; }
    .role-settings legend { padding: 0 5px; color: var(--gold-2); font-weight: 750; }
    .role-setting { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 46px; }
    .role-setting + .role-setting { border-top: 1px solid var(--line); }
    .role-setting label { display: flex; align-items: center; gap: 7px; cursor: pointer; }
    .role-setting input[type="checkbox"] { width: 18px; height: 18px; margin: 0; accent-color: var(--gold); }
    .role-setting input[type="number"] { width: 64px; min-height: 38px; padding: 4px 7px; border: 1px solid var(--line); border-radius: 8px; color: var(--text); background: var(--panel-2); }
    .role-setting input:disabled { opacity: .45; }
    .callout { padding: 16px 18px; border-left: 4px solid var(--gold); border-radius: 4px 14px 14px 4px; background: rgba(216,174,94,.09); color: #ded7ca; }
    .callout.red { border-left-color: var(--blood-2); background: rgba(164,58,58,.12); }
    .callout.green { border-left-color: var(--good); background: rgba(99,176,140,.1); }
    .role-card { position: relative; overflow: hidden; padding: clamp(26px,7vw,62px); min-height: 370px; display: flex; flex-direction: column; justify-content: space-between; border: 1px solid rgba(216,174,94,.5); border-radius: 28px; background: radial-gradient(circle at 85% 5%, rgba(216,174,94,.19), transparent 40%), linear-gradient(150deg,#292521,#171920 62%); box-shadow: var(--shadow); }
    .role-card.mafia { border-color: rgba(214,91,85,.55); background: radial-gradient(circle at 85% 5%, rgba(164,58,58,.3), transparent 42%), linear-gradient(150deg,#2b1d20,#171920 62%); }
    .role-name { font-family: Georgia, "Times New Roman", serif; font-size: clamp(2.7rem,9vw,5.8rem); line-height: .98; }
    .role-meta { margin-top: 12px; color: var(--gold-2); font-weight: 800; text-transform: uppercase; letter-spacing: .12em; }
    .role-card.mafia .role-meta { color: #ee8a82; }
    .role-copy { max-width: 650px; margin-top: 18px; color: #d6d0c6; font-size: 1.08rem; }
    .privacy { min-height: 60dvh; display: grid; place-content: center; text-align: center; }
    .privacy > div { width: min(90vw,900px); }
    .privacy-icon { width: 88px; height: 88px; margin: 0 auto 20px; display: grid; place-items: center; border-radius: 50%; background: rgba(216,174,94,.1); border: 1px solid rgba(216,174,94,.4); font-size: 2.1rem; }
    .phase-list, .roster { display: grid; gap: 10px; margin-top: 20px; }
    .roster-row { min-height: 56px; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 11px 14px; border: 1px solid var(--line); border-radius: 14px; background: rgba(16,18,24,.54); }
    .roster-row.dead { opacity: .5; text-decoration: line-through; }
    .tag { display: inline-flex; align-items: center; min-height: 30px; padding: 5px 10px; border-radius: 999px; background: rgba(216,174,94,.12); color: var(--gold-2); font-size: .8rem; font-weight: 800; }
    .tag.red { background: rgba(164,58,58,.17); color: #f08b83; }
    .tag.green { background: rgba(99,176,140,.14); color: #86d0ad; }
    .notice-list { display: grid; gap: 9px; margin-top: 18px; }
    .notice { padding: 14px 16px; border: 1px solid var(--line); border-radius: 14px; background: rgba(10,12,17,.4); }
    .notice strong { color: var(--gold-2); }
    .death-list { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 13px; margin-top: 22px; }
    .death { padding: 25px 18px; border: 1px solid rgba(214,91,85,.45); border-radius: 18px; background: rgba(164,58,58,.13); text-align: center; font: 700 1.45rem Georgia,serif; }
    .vote-card { padding: 17px; border: 1px solid var(--line); border-radius: 17px; background: rgba(18,21,28,.75); }
    .vote-card span { display: block; color: var(--muted); margin-top: 3px; }
    .tally-list { display: grid; gap: 12px; margin-top: 22px; }
    .tally-row { display: grid; grid-template-columns: minmax(0,1fr) auto auto; align-items: center; gap: 14px; padding: 14px; border: 1px solid var(--line); border-radius: 18px; background: rgba(18,21,28,.75); }
    .tally-row.selected { border-color: var(--gold-2); background: rgba(216,174,94,.11); box-shadow: inset 0 0 0 1px var(--gold); }
    .tally-name strong { display: block; font-size: 1.08rem; }
    .tally-name span { color: var(--muted); font-size: .88rem; }
    .vote-power { min-width: 86px; text-align: center; font: 800 1.65rem Georgia,serif; color: var(--gold-2); }
    .vote-power small { display: block; color: var(--muted); font: 700 .76rem Inter,ui-sans-serif,system-ui,sans-serif; text-transform: uppercase; letter-spacing: .08em; }
    .select-elimination { min-width: 112px; min-height: 54px; }
    .action-layout { display: grid; grid-template-columns: minmax(0,.9fr) minmax(0,1.1fr); gap: 18px; align-items: stretch; min-height: calc(100dvh - 125px); }
    .action-layout .role-card { min-height: 0; height: 100%; padding: clamp(22px,4vw,42px); }
    .action-layout .panel { margin-top: 0; max-height: calc(100dvh - 125px); overflow-y: auto; overscroll-behavior: contain; }
    .action-layout .table-map { margin-left: 24px; margin-right: 24px; }
    .action-layout .seat-button { width: 52px; font-size: .7rem; border-radius: 12px; }
    .progress { height: 8px; margin: 0 0 20px; border-radius: 999px; overflow: hidden; background: #252935; }
    .progress > span { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg,var(--blood-2),var(--gold)); transition: width .25s ease; }
    .menu-btn { min-width: 48px; min-height: 48px; border: 1px solid var(--line); border-radius: 14px; background: rgba(26,29,37,.8); color: var(--text); }
    .back-btn { min-height: 48px; padding: 0 16px; border: 1px solid var(--line); border-radius: 14px; background: rgba(26,29,37,.8); color: var(--text); font-weight: 800; }
    .back-btn:disabled { opacity: .35; cursor: not-allowed; }
    dialog { width: min(92vw,500px); padding: 0; border: 1px solid var(--line); border-radius: 22px; background: var(--panel); color: var(--text); box-shadow: var(--shadow); }
    dialog::backdrop { background: rgba(4,5,8,.75); backdrop-filter: blur(4px); }
    dialog .dialog-body { padding: 24px; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    @media (max-width: 700px) {
      .shell { padding-left: 15px; padding-right: 15px; }
      .grid, .grid.three, .choice-grid, .name-list, .death-list { grid-template-columns: 1fr; }
      .actions { grid-template-columns: 1fr; }
      .actions .wide { grid-column: auto; }
      .player-setup { grid-template-columns: minmax(0,1fr) 100px; }
      .card-picker { grid-template-columns: repeat(3,minmax(0,1fr)); }
      .table-controls { grid-template-columns: 1fr; }
      .table-map, .table-map.selection-map { height: 430px; margin-left: 30px; margin-right: 30px; }
      .seat-button { width: 66px; font-size: .76rem; }
      .tally-row { grid-template-columns: minmax(0,1fr) auto; }
      .select-elimination { grid-column: 1 / -1; width: 100%; }
      .action-layout { grid-template-columns: 1fr; min-height: 0; }
      .action-layout .role-card { height: auto; }
      .action-layout .panel { max-height: none; overflow: visible; }
      .status-pill { font-size: .78rem; }
      .role-card { min-height: 410px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <main id="app" class="shell" aria-live="polite"></main>
  <dialog id="menuDialog">
    <div class="dialog-body">
      <p class="eyebrow">Game menu</p>
      <h2>Pause the table</h2>
      <p class="lead">Your game saves automatically on this device.</p>
      <div class="actions">
        <button class="btn" onclick="Game.closeMenu()">Return to game</button>
        <button class="btn danger" onclick="Game.confirmReset()">Start a new game</button>
      </div>
    </div>
  </dialog>
  <script>
  'use strict';
  const STORAGE_KEY = 'mafia-night-runner-v2';
  const ROLES = {
    Mafioso: { alignment:'Mafia', category:'Mafioso', copy:'Choose a player to shoot during the final Mafia phase. You may target anyone, including yourself.' },
    Auditor: { alignment:'Mafia', category:'Auditor', copy:'Investigate one player and secretly remove one of their votes for the following day.' },
    Consort: { alignment:'Mafia', category:'Mafia Support', copy:'Choose one player to Block. Mafia Support and Town Support are immune, but still learn that an attempt occurred.' },
    Consigliere: { alignment:'Mafia', category:'Mafia Support', copy:'During the final Mafia phase, learn one player’s exact role.' },
    Witch: { alignment:'Mafia', category:'Mafia Support', copy:'Control one eligible player and force one action onto your chosen target. Town Support and non-Auditor Mafia are immune, but still learn that an attempt occurred.' },
    Tracker: { alignment:'Mafia', category:'Mafia Support', copy:'Watch one player during the first Mafia phase. Learn who visited them when the Mafia wake again that night.' },
    Blackmailer: { alignment:'Mafia', category:'Mafia Support', copy:'Choose one player who may only vote during the following day.' },
    Tavernkeeper: { alignment:'Town', category:'Town Support', copy:'Choose one player to Block. Mafia Support and Town Support are immune, but the Mafioso and Auditor are not.' },
    Admirer: { alignment:'Town', category:'Town Support', copy:'Protect one player from Blocking, Witching, Blackmail, Auditor vote removal, and Vigilante guilt.' },
    Catalyst: { alignment:'Town', category:'Town Support', copy:'Choose one player. They receive two actions on the following night.' },
    Sheriff: { alignment:'Town', category:'Other Town', copy:'Investigate one player and learn whether they appear Good or Bad.' },
    Lookout: { alignment:'Town', category:'Other Town', copy:'Watch one player. On the following night, learn who visited them.' },
    Vigilante: { alignment:'Town', category:'Other Town', copy:'Beginning on Night 2, choose one player to shoot. Killing Town creates guilt.' },
    Veteran: { alignment:'Town', category:'Other Town', copy:'Activate to shoot every Mafia visitor and become immune to death that night.' },
    Cleric: { alignment:'Town', category:'Other Town', copy:'Protect one player from every shot that night. You may protect yourself once per game.' },
    Pilgrim: { alignment:'Town', category:'Other Town', copy:'You have no night ability.' },
    Aristocrat: { alignment:'Town', category:'Other Town', copy:'Assign your extra vote to a player. While alive, you may change the assignment each night.' }
  };
  const SUPPORT_ROLES = ['Consort','Consigliere','Witch','Blackmailer','Tracker'];
  const TOWN_SUPPORT_ROLES = ['Tavernkeeper','Admirer','Catalyst'];
  const RANDOM_TOWN_ROLES = ['Sheriff','Lookout','Vigilante','Veteran','Cleric','Pilgrim','Aristocrat'];
  const ROLE_POOLS = [SUPPORT_ROLES,TOWN_SUPPORT_ROLES,RANDOM_TOWN_ROLES];
  const TOWN_GUARANTEE_GROUPS = [
    {key:'investigative',label:'Town Investigative',roles:['Sheriff','Lookout']},
    {key:'killing',label:'Town Killing',roles:['Vigilante','Veteran']}
  ];
  const DEFAULT_GUARANTEES = {investigative:2,killing:1,Cleric:1};
  const CARD_RANKS = ['K','Q','J','3','5','6','7'];
  const CARD_SUITS = ['♠','♥','♦','♣'];
  const PLAYING_CARDS = CARD_RANKS.flatMap(rank=>CARD_SUITS.map(suit=>rank+suit));
  const PHASE_NAMES = { 1:'Mafia Support', 2:'Town Support', 3:'Other Town', 4:'Auditor', 5:'Mafia' };
  let state = loadState() || freshState();
  normalizeLayoutState();
  let undoHistory = [];
  let renderedSnapshot = JSON.stringify(state);
  let restoringState = false;
  let pendingPlayerSelection = null;
  let draggingSeatIndex = null;
  let lastViewKey = null;

  function freshState() {
    return {
      version: 2,
      mode: 'setup',

    const mafiaInfo=card.meta==='Mafia'&&p.category!=='Auditor'?`<div class="callout red" style="margin-top:22px"><strong>Your known Mafia:</strong> ${teammates.map(x=>esc(x.name)+(x.category==='Mafioso'?' — Mafioso':' — Mafia Support')).join(', ')||'None'}</div>`:'';
    return main(`${progress(state.revealIndex+1,total)}<article class="role-card ${card.meta==='Mafia'?'mafia':''}"><div><p class="eyebrow">${esc(p.name)} · ${cardMarkup(p.card)}</p><div class="role-name">${esc(card.name)}</div><div class="role-meta">${esc(card.meta)}</div><p class="role-copy">${esc(card.copy)}</p>${mafiaInfo}</div><button class="btn primary" onclick="Game.nextReveal()">Hide role & continue</button></article>`,'Role cards');
  }

  function nightRole(p) {
    const chosen=state.nightState?.necronomiconMafiosoId;
    return chosen&&p?.id===chosen ? 'Mafioso' : p?.role;
  }
  function nightMafioso() { return alive().find(p=>nightRole(p)==='Mafioso'); }
  function isMafiaSupport(p) { return ROLES[nightRole(p)]?.category==='Mafia Support'; }
  function mafiaWakeCards() {
    return state.cardDeck.filter(entry=>entry.category==='Mafioso'||entry.category==='Mafia Support');
  }
  function rebuildMafiaActors() {
    const ns=state.nightState;
    ns.supportActors=alive().filter(p=>isMafiaSupport(p)&&nightRole(p)!=='Consigliere').map(p=>p.id);
    ns.consigActors=alive().filter(p=>nightRole(p)==='Consigliere').map(p=>p.id);
  }
  function isTownSupport(p) { return p && ROLES[p.role]?.category==='Town Support'; }
  function hasPriorBW(id) { return !!state.lastEffects[id]?.blockOrWitch; }
  function hasPriorBlackmail(id) { return !!state.lastEffects[id]?.blackmail; }
  function nightActions(type,targetKey='targetId',targetId=null) {
    const list=state.nightState?.actions||[];
    return list.filter(a=>a.type===type&&(targetId===null||a[targetKey]===targetId));
  }
  function isAdmired(id) { return nightActions('admire','targetId',id).length>0; }
  function effectFor(id) {
    const p=byId(id), admired=isAdmired(id), blockAttempts=nightActions('block','targetId',id);
    const blockRoleImmune=a=>isTownSupport(p)||isMafiaSupport(p)||(a.sourceRole==='Consort'&&isMafia(p)&&p.role!=='Auditor');
    const blockImmuneAttempted=!admired&&blockAttempts.some(blockRoleImmune);
    const validBlocks=blockAttempts.filter(a=>{
      if(admired||hasPriorBW(id)||blockRoleImmune(a)) return false;
      return true;
    });
    const witchAttempts=nightActions('witch','controlledId',id);
    const witchRoleImmune=isTownSupport(p)||(isMafia(p)&&p.role!=='Auditor');
    const witchImmuneAttempted=!admired&&witchRoleImmune&&witchAttempts.length>0;
    const validWitches=witchAttempts.filter(a=>{
      if(admired||hasPriorBW(id)||witchRoleImmune) return false;
      // A forced Cleric self-protection consumes its limit, but remains a successful Witch effect.
      return a.applied===true||canForceAction(p,a.forcedId);
    });
    const blackmailAttempts=nightActions('blackmail','targetId',id);
    const blackmailRoleImmune=isMafia(p)&&p.role!=='Auditor';
    const blackmailImmuneAttempted=!admired&&blackmailRoleImmune&&blackmailAttempts.length>0;
    const validBlackmail=blackmailAttempts.filter(a=>!(admired||hasPriorBlackmail(id)||blackmailRoleImmune));
    return {
      admired,
      blockCount:validBlocks.length,
      witchCount:validWitches.length,
      blackmailCount:validBlackmail.length,
      blockAttemptCount:blockAttempts.length,
      witchAttemptCount:witchAttempts.length,
      blackmailAttemptCount:blackmailAttempts.length,
      blockImmuneCount:admired?0:blockAttempts.filter(blockRoleImmune).length,
      witchImmuneCount:witchImmuneAttempted?witchAttempts.length:0,
      blackmailImmuneCount:blackmailImmuneAttempted?blackmailAttempts.length:0,
      blocked:validBlocks.length>0,
      blockAttempted:blockAttempts.length>0,
      blockImmuneAttempted,
      witch:validWitches[0]||null,
      witchAttempted:witchAttempts.length>0,
      witchImmuneAttempted,
      blackmailed:validBlackmail.length>0,
      blackmailAttempted:blackmailAttempts.length>0,
      blackmailImmuneAttempted
    };
  }
  function addVisit(actorId,targetId) {
    if(!targetId||actorId===targetId) return;
    const ns=state.nightState;
    if(!ns.visits.some(v=>v.actorId===actorId&&v.targetId===targetId)) ns.visits.push({actorId,targetId});
  }
  function recordAction(action) {
    action.order=state.nightState.actions.length;
    state.nightState.actions.push(action);
    if(action.type==='witch') addVisit(action.actorId,action.controlledId);
    else if(action.type!=='veteran'&&action.targetId) addVisit(action.actorId,action.targetId);
  }
  function activeCatalyzed(id) { return state.nightState.activeCatalysts.includes(id); }
  function catalystCount(id) { return state.nightState.activeCatalysts.filter(targetId=>targetId===id).length; }
  function effectTimes(count) { return `${count} ${count===1?'time':'times'}`; }
  function effectNotice(effect,count) { return `<strong>You were ${effect} ${effectTimes(count)}.</strong>`; }
  function immuneNotice(effect,count) { return `<strong>${effect} was attempted against you ${effectTimes(count)}.</strong> Your role is immune, so ${count===1?'the attempt had':'the attempts had'} no effect.`; }
  function legalTargets(role,actorId,priorTargets=[]) {
    const actor=byId(actorId);
    return alive().filter(t=>{
      if(priorTargets.includes(t.id)) return false;
      const self=t.id===actorId;
      if(self&&!['Mafioso','Cleric','Aristocrat'].includes(role)) return false;
      if(role==='Cleric'&&self&&actor.selfProtectUsed) return false;
      return true;
    });
  }
  function roleHasTargetedAction(role) { return !['Veteran','Pilgrim'].includes(role); }
  function canForceAction(player,targetId) {
    const role=nightRole(player);
    if(!player||!ROLES[role]||!roleHasTargetedAction(role)) return false;
    if(role==='Vigilante'&&(state.night===1||((state.guiltDue[player.id]||0)>0&&!isAdmired(player.id)))) return false;
    return legalTargets(role,player.id).some(target=>target.id===targetId);
  }
  function sheriffResult(target) {
    if(target.role==='Auditor') return 'Bad';
    if(nightRole(target)==='Mafioso') return state.setup.necronomicon||alive().filter(isMafia).length>1?'Good':'Bad';
    return isMafia(target)?'Bad':'Good';
  }
  function applyTargetAction(plan,targetId,forced=false) {
    const actor=byId(plan.actorId), target=byId(targetId), role=nightRole(actor);
    if(!target||!target.alive) return false;
    const self=actor.id===target.id;
    if(self&&!['Mafioso','Cleric','Aristocrat'].includes(role)) return false;
    if(role==='Cleric'&&self&&actor.selfProtectUsed) return false;
    const base={actorId:actor.id,targetId:target.id,sourceRole:role,forced};
    if(role==='Consort'||role==='Tavernkeeper') recordAction({...base,type:'block'});
    else if(role==='Blackmailer') recordAction({...base,type:'blackmail'});
    else if(role==='Admirer') recordAction({...base,type:'admire'});
    else if(role==='Catalyst') recordAction({...base,type:'catalyst'});
    else if(role==='Sheriff') { recordAction({...base,type:'sheriff'}); plan.messages.push(`Your result for <strong>${esc(target.name)}</strong>: <strong>${sheriffResult(target)}</strong>.`); }
    else if(role==='Lookout'||role==='Tracker') {
      recordAction({...base,type:role.toLowerCase()});
      const reportTime=role==='Tracker'?'when the Mafia wake again tonight':'next night';
      plan.messages.push(`You are watching <strong>${esc(target.name)}</strong>. The visitor report arrives ${reportTime}.`);
    }
    else if(role==='Vigilante'||role==='Mafioso') recordAction({...base,type:'shot',shotRole:role});
    else if(role==='Cleric') { recordAction({...base,type:'protect'}); if(self) actor.selfProtectUsed=true; }
    else if(role==='Aristocrat') recordAction({...base,type:'aristocrat'});
    else if(role==='Consigliere') { recordAction({...base,type:'consigliere'}); plan.messages.push(`<strong>${esc(target.name)}</strong> is the <strong>${esc(nightRole(target))}</strong>.`); }
    else if(role==='Auditor') { recordAction({...base,type:'audit'}); plan.messages.push(`<strong>${esc(target.name)}</strong> is the <strong>${esc(nightRole(target))}</strong>.`); }
    else return false;
    return true;
  }
  function preparePlan(actorId,context) {
    const p=byId(actorId), fx=effectFor(actorId), catalyzed=activeCatalyzed(actorId);
    const role=nightRole(p);
    p.revealedExact=true;
    if(role==='Veteran') {
      const available=p.veteranActivations<2&&!p.veteranLostSecond;
      const deferredMessages=playerNotices(p);
      return {actorId,context,remaining:available?1:0,userTargets:[],messages:available?[]:['You have no Veteran activations remaining.',...deferredMessages],deferredMessages:available?deferredMessages:[],done:!available,draftControlled:null};
    }
    let base=(catalyzed&&role!=='Veteran')?2:1;
    // Stage 2 Admiration may suppress attempts made during the first Mafia wake.
    const messages=[], deferImmuneNotices=context==='Stage 1';
    if(catalyzed) messages.push(effectNotice('Catalyzed',catalystCount(actorId))+' You may use up to two actions tonight, subject to your role.');
    if(fx.blackmailed) messages.push(effectNotice('Blackmailed',fx.blackmailCount)+' Tomorrow you may only vote.');
    else if(fx.blackmailImmuneAttempted&&!deferImmuneNotices) messages.push(immuneNotice('Blackmail',fx.blackmailImmuneCount));
    if(role==='Pilgrim') base=0;
    if(role==='Vigilante'&&state.night===1) { base=0; messages.push('The Vigilante cannot shoot on Night 1.'); }
    if(role==='Vigilante'&&(state.guiltDue[p.id]||0)>0&&!fx.admired) { base=0; messages.push('<strong>You have no action tonight.</strong>'); }
    if(role==='Veteran'&&(p.veteranActivations>=2||p.veteranLostSecond)) { base=0; messages.push('You have no Veteran activations remaining.'); }
    if(fx.blocked) {
      if(catalyzed&&base>0) base=Math.max(0,base-1); else base=0;
      messages.push(effectNotice('Blocked',fx.blockCount)+(catalyzed?' One of your two actions was removed.':' You have no action tonight.'));
    } else if(fx.blockImmuneAttempted&&!deferImmuneNotices) messages.push(immuneNotice('Blocking',fx.blockImmuneCount));
    const plan={actorId,context,remaining:base,userTargets:[],messages,done:false,draftControlled:null};
    if(Array.isArray(p.lookoutInbox)&&p.lookoutInbox.length) { p.lookoutInbox.forEach(report=>messages.push(`<strong>Lookout report:</strong> ${report}`)); p.lookoutInbox=[]; }
    if(fx.witch) {
      messages.push(effectNotice('Witched',fx.witchCount)+` The forced target was ${esc(byId(fx.witch.forcedId)?.name||'unknown')}.`);
      if(plan.remaining>0&&roleHasTargetedAction(role)) {
        const worked=applyTargetAction(plan,fx.witch.forcedId,true);
        if(worked) { fx.witch.applied=true; plan.remaining--; }
      } else if(!roleHasTargetedAction(role)) messages.push('Your role has no targeted action, so the Witch could not control it.');
    } else if(fx.witchImmuneAttempted&&!deferImmuneNotices) messages.push(immuneNotice('Witching',fx.witchImmuneCount));
    if(plan.remaining<=0) plan.done=true;
    return plan;
  }
  function playerNotices(p) {
    const fx=effectFor(p.id), result=[];
    if(activeCatalyzed(p.id)) result.push(effectNotice('Catalyzed',catalystCount(p.id))+(p.role==='Veteran'?' This does not grant an additional activation.':' Up to two actions are available, subject to your role and other effects.'));
    if(fx.blocked) result.push(effectNotice('Blocked',fx.blockCount)+(p.role==='Veteran'?' You cannot activate tonight; no activation is consumed.':activeCatalyzed(p.id)?' One action has been removed.':' Your action has been removed.'));
    else if(fx.blockImmuneAttempted) result.push(immuneNotice('Blocking',fx.blockImmuneCount));
    if(fx.witch) result.push(effectNotice('Witched',fx.witchCount)+' One available targeted action is forced.');
    else if(fx.witchImmuneAttempted) result.push(immuneNotice('Witching',fx.witchImmuneCount));
    if(fx.blackmailed) result.push(effectNotice('Blackmailed',fx.blackmailCount)+' Tomorrow you may only vote.');
    else if(fx.blackmailImmuneAttempted) result.push(immuneNotice('Blackmail',fx.blackmailImmuneCount));
    return result;
  }

  function advanceNight() {
    const ns=state.nightState;
    if(ns.screen==='auditor-identify-intro') {
      const entry=state.cardDeck.find(x=>x.category==='Auditor');
      return beginIdentify([entry.card],'stage2-intro');
    } else if(ns.screen==='stage1-intro'){
      const mafiaCards=mafiaWakeCards().map(entry=>entry.card);
      if(mafiaCards.some(card=>!playerByCard(card))) {
        return beginIdentify(mafiaCards,state.setup.necronomicon?'stage1-intro':'stage1-action');
      }
      if(!nightMafioso()) return;
      ns.screen='stage1-action'; ns.actorIndex=0; ns.currentPlan=null;
      if(!ns.supportActors.length) finishMafiaSupport();
    } else if(ns.screen==='stage2-intro'){
      const entry=currentTownSupportCard();
      if(!entry) ns.screen='stage3-intro';
      else if(!entry.holderId) return beginIdentify([entry.card],'stage2-action');
      else {
        ns.screen='stage2-action'; ns.currentPlan=null;
        if(!currentTownSupportPlayer()) return advanceAfterActor();
      }
    } else if(ns.screen==='stage3-intro'){
      ns.actorIndex=0; ns.currentPlan=null; ns.screen=ns.otherOrder.length?'stage3-pass':'stage4-intro';
    } else if(ns.screen==='stage4-intro'){
      const entry=state.cardDeck.find(x=>x.category==='Auditor');
      if(entry&&!entry.holderId) return beginIdentify([entry.card],'stage4-action');
      ns.currentPlan=null; ns.screen=alive().some(p=>p.role==='Auditor')?'stage4-action':'stage5-intro';
    } else if(ns.screen==='stage5-intro'||ns.screen==='stage5-tracker'){
      ns.actorIndex=0; ns.currentPlan=null;
      if(ns.screen==='stage5-intro'&&trackerWatches().length) ns.screen='stage5-tracker';
      else ns.screen=ns.consigActors.length?'stage5-consig':'stage5-mafioso';
    }
    render();
  }
  function beginPrivateActor() {
    const ns=state.nightState, ref=ns.otherOrder[ns.actorIndex], p=turnPlayer(ref);
    if(!p) return beginIdentify([ref],'stage3-action');
    // Keep every card's wake call, but never prepare or execute a dead player's action.
    if(!p.alive) { ns.screen='stage3-action'; return advanceAfterActor(); }
    ns.currentPlan=preparePlan(p.id,'Stage 3'); ns.screen='stage3-action'; render();
  }
  function advanceAfterActor() {
    const ns=state.nightState;
    if(ns.currentPlan) {
      if(!Array.isArray(ns.completedActors)) ns.completedActors=[];
      if(!ns.completedActors.includes(ns.currentPlan.actorId)) ns.completedActors.push(ns.currentPlan.actorId);
    }
    ns.currentPlan=null;
    if(ns.screen==='stage1-action') { ns.actorIndex++; if(ns.actorIndex>=ns.supportActors.length){finishMafiaSupport();ns.actorIndex=0;} }
    else if(ns.screen==='stage2-action') {
      ns.townSupportIndex=(ns.townSupportIndex ?? 0)+1;
      ns.screen=currentTownSupportCard()?'stage2-intro':'stage3-intro';
    }
    else if(ns.screen==='stage3-action') { ns.actorIndex++; ns.screen=ns.actorIndex<ns.otherOrder.length?'stage3-pass':'stage4-intro'; }
    else if(ns.screen==='stage4-action') ns.screen='stage5-intro';
    else if(ns.screen==='stage5-consig') { ns.actorIndex++; if(ns.actorIndex>=ns.consigActors.length){ns.actorIndex=0;ns.screen='stage5-mafioso';} }
    else if(ns.screen==='stage5-mafioso') ns.screen='resolve-ready';
    render();
  }
  function chooseSuccessor(id) {
    const ns=state.nightState, player=byId(id);
    if(state.mode!=='night'||ns?.screen!=='stage1-intro'||!player?.alive||!isMafiaSupport(player)||nightMafioso()) return;
    if(mafiaWakeCards().some(entry=>!entry.holderId)) return;
    if(state.setup.necronomicon) ns.necronomiconMafiosoId=id;
    else promoteToMafioso(id);
    rebuildMafiaActors();
    render();
  }
  function finishMafiaSupport() {
    const auditor=state.cardDeck.find(entry=>entry.category==='Auditor'&&!entry.holderId);
    state.nightState.screen=state.night===1&&auditor?'auditor-identify-intro':'stage2-intro';
  }
  function chooseRoleTarget(id) {
    const plan=state.nightState.currentPlan;
    if(!applyTargetAction(plan,id,false)) return;
    plan.userTargets.push(id); plan.remaining--; if(plan.remaining<=0) plan.done=true; render();
  }
  function chooseWitchControlled(id) { state.nightState.currentPlan.draftControlled=id; render(); }
  function chooseWitchForced(id) {
    const plan=state.nightState.currentPlan, actor=byId(plan.actorId);
    recordAction({type:'witch',actorId:actor.id,controlledId:plan.draftControlled,forcedId:id,sourceRole:'Witch'});
    plan.userTargets.push(plan.draftControlled); plan.draftControlled=null; plan.remaining--; if(plan.remaining<=0) plan.done=true; render();

  function cancelWitchDraft() { state.nightState.currentPlan.draftControlled=null; render(); }
  function activateVeteran() {
    finishVeteranChoice(true);
  }
  function finishVeteranChoice(activate) {
    const ns=state.nightState, plan=ns.currentPlan, p=byId(plan?.actorId);
    if(!p?.alive||p.role!=='Veteran'||plan.done||plan.remaining<=0) return;
    const blocked=effectFor(p.id).blocked;
    const activated=activate&&!blocked&&p.veteranActivations<2&&!p.veteranLostSecond;
    if(!ns.veteranChoices) ns.veteranChoices={};
    ns.veteranChoices[p.id]={choice:activate?'activate':'do not activate',activated,canceledByBlock:activate&&blocked};
    if(activated) { recordAction({type:'veteran',actorId:p.id,sourceRole:'Veteran'}); p.veteranActivations++; }
    plan.messages.push(...(plan.deferredMessages||[])); plan.deferredMessages=[];
    plan.messages.push(activated?'You activated tonight.':activate&&blocked?'Your activation was canceled. No activation was used.':'You did not activate tonight.');
    plan.remaining=0; plan.done=true; render();
  }
  function skipActions() { const plan=state.nightState.currentPlan; if(byId(plan.actorId)?.role==='Veteran') return finishVeteranChoice(false); plan.remaining=0; plan.done=true; plan.draftControlled=null; render(); }

  function buildNightDebug(resolution=null) {
    const ns=state.nightState;
    if(!ns) return '';
    const name=id=>byId(id)?.name||id||'unknown';
    const describe=a=>`${a.type}${a.shotRole?' ('+a.shotRole+')':''}: ${name(a.actorId)}${a.type==='witch'?' controls '+name(a.controlledId)+' -> '+name(a.forcedId):a.targetId?' -> '+name(a.targetId):''}${a.forced?' [forced]':''}`;
    const shots=resolution?.shots||nightActions('shot');
    const protections=resolution?.protectedIds||new Set(nightActions('protect').map(a=>a.targetId));
    const veterans=resolution?.activeVeterans||new Set(nightActions('veteran').map(a=>a.actorId));
    const lines=[`Night ${state.night} - ${resolution?'resolved':'in progress (effects provisional; retaliation and deaths not resolved)'}`];
    if(ns.necronomiconMafiosoId) lines.push(`Necronomicon Mafioso: ${name(ns.necronomiconMafiosoId)}`);
    state.players.forEach(p=>{
      const fx=effectFor(p.id), actions=ns.actions.filter(a=>a.actorId===p.id);
      const incoming=ns.actions.filter(a=>(a.type==='witch'?a.controlledId:a.targetId)===p.id);
      const receivedShots=shots.filter(a=>a.targetId===p.id);
      const due=state.guiltDue[p.id]||0;
      const effects={
        shot:receivedShots.length, healed:protections.has(p.id), veteranActive:veterans.has(p.id),
        admired:fx.admired, catalyzed:activeCatalyzed(p.id), catalyzedNextNight:nightActions('catalyst','targetId',p.id).length>0,
        blocked:fx.blocked, blackmailed:fx.blackmailed, witched:!!fx.witch,
        blockCount:fx.blockCount, blackmailCount:fx.blackmailCount, witchCount:fx.witchCount,
        blockAttemptCount:fx.blockAttemptCount, blackmailAttemptCount:fx.blackmailAttemptCount, witchAttemptCount:fx.witchAttemptCount,
        blockImmuneCount:fx.blockImmuneCount, blackmailImmuneCount:fx.blackmailImmuneCount, witchImmuneCount:fx.witchImmuneCount,
        catalystCount:catalystCount(p.id), admirationCount:nightActions('admire','targetId',p.id).length, protectionCount:nightActions('protect','targetId',p.id).length,
        blockAttempted:fx.blockAttempted, blackmailAttempted:fx.blackmailAttempted, witchAttempted:fx.witchAttempted,
        blockImmuneAttempted:fx.blockImmuneAttempted, blackmailImmuneAttempted:fx.blackmailImmuneAttempted, witchImmuneAttempted:fx.witchImmuneAttempted,
        priorBlockOrWitch:hasPriorBW(p.id), priorBlackmail:hasPriorBlackmail(p.id),
        auditVoteRemoval:fx.admired?0:nightActions('audit','targetId',p.id).length,
        guiltyDueTonight:due, guiltPrevented:due>0&&fx.admired,
        newGuilt:resolution?(resolution.newGuilt[p.id]||0):'pending resolution',
        guiltDeath:resolution?!!(p.alive&&due>0&&!fx.admired&&!veterans.has(p.id)):'pending resolution',
        diedTonight:resolution?resolution.deaths.has(p.id):'pending resolution',
        selfProtectUsed:!!p.selfProtectUsed, veteranActivations:p.veteranActivations||0,
        veteranLostSecond:!!p.veteranLostSecond,
        veteranChoice:ns.veteranChoices?.[p.id]||null,
        aristocratRecipient:p.aristocratRecipient?name(p.aristocratRecipient):null
      };
      const completed=ns.completedActors?.includes(p.id)||(ns.currentPlan?.actorId===p.id&&ns.currentPlan.done);
      lines.push('',`${p.name} | role: ${p.role||'not paired yet'} | card: ${p.card||'not paired yet'} | ${p.alive?(resolution?.deaths.has(p.id)?'died this night':'alive'):'already dead'}`,
        `Actions: ${actions.length?actions.map(describe).join('; '):!p.alive?'none (already dead)':resolution||completed?'none recorded (skipped or unavailable)':'none recorded yet'}`,
        `Visited by: ${ns.visits.filter(v=>v.targetId===p.id).map(v=>name(v.actorId)).join(', ')||'none'}`,
        `Incoming actions/attempts: ${incoming.map(describe).join('; ')||'none'}`,
        `Shots received: ${receivedShots.map(a=>describe(a)+(protections.has(p.id)?' [prevented by Cleric]':veterans.has(p.id)?' [prevented by Veteran immunity]':resolution?' [lethal]':' [pending]')).join('; ')||'none'}`,
        `Veteran retaliation: ${resolution?shots.filter(a=>a.actorId===p.id&&a.shotRole==='Veteran').map(describe).join('; ')||'none':'pending resolution'}`,
        `Effects: ${JSON.stringify(effects)}`);
    });
    return lines.join('\n');
  }
  function debugLogText() {
    const logs=(state.debugNights||[]).map(entry=>entry.text);
    if(state.nightState) logs.push(buildNightDebug());
    return 'GM DEBUG LOG - contains all hidden roles and actions.\nHealed means Cleric protection was applied, even if no shot occurred. Attempts and effective effects are listed separately.\nOnly nights recorded since this debug feature was added are available.\n\n'+(logs.join('\n\n--------------------\n\n')||'No night records yet.');

    d.innerHTML=`<div class="dialog-body"><label for="debugLog">Night debug log (GM only)</label><textarea id="debugLog" readonly spellcheck="false" style="width:100%;height:65vh;white-space:pre;font-family:monospace">${esc(debugLogText())}</textarea><div class="actions"><button class="btn" onclick="Game.openMenu()">Back to menu</button><button class="btn" onclick="Game.closeMenu()">Close</button></div></div>`;
    if(!d.open) d.showModal();

  function resolveNight() {
    const ns=state.nightState, activeVeterans=new Set(nightActions('veteran').map(a=>a.actorId));
    nightActions('aristocrat').sort((a,b)=>a.order-b.order).forEach(a=>{ const p=byId(a.actorId); if(p) p.aristocratRecipient=a.targetId; });
    state.pendingCatalysts=nightActions('catalyst').map(a=>a.targetId);
    state.dayAuditTargets=nightActions('audit').filter(a=>!isAdmired(a.targetId)).map(a=>a.targetId);
    state.dayBlackmailed=alive().filter(p=>effectFor(p.id).blackmailed).map(p=>p.id);

    const veteranShots=[];
    activeVeterans.forEach(vetId=>{
      const visitors=[...new Set(ns.visits.filter(v=>v.targetId===vetId).map(v=>v.actorId))];
      visitors.map(byId).filter(p=>p&&isMafia(p)).forEach(p=>veteranShots.push({type:'shot',actorId:vetId,targetId:p.id,shotRole:'Veteran',sourceRole:'Veteran'}));
    });
    const shots=[...nightActions('shot'),...veteranShots];
    const protectedIds=new Set(nightActions('protect').map(a=>a.targetId));
    const deaths=new Set();
    shots.forEach(s=>{ if(!protectedIds.has(s.targetId)&&!activeVeterans.has(s.targetId)) deaths.add(s.targetId); });
    Object.entries(state.guiltDue).forEach(([id,count])=>{
      const p=byId(id); if(count>0&&p?.alive&&!isAdmired(id)&&!activeVeterans.has(id)) deaths.add(id);
    });

    const newGuilt={};
    shots.filter(s=>s.shotRole==='Vigilante').forEach(s=>{
      const target=byId(s.targetId);
      if(target&&ROLES[target.role].alignment==='Town'&&deaths.has(target.id)&&!protectedIds.has(target.id)&&!activeVeterans.has(target.id)) newGuilt[s.actorId]=(newGuilt[s.actorId]||0)+1;
    });
    activeVeterans.forEach(vetId=>{
      const vet=byId(vetId); if(!vet||vet.veteranActivations!==1) return;
      const earned=veteranShots.some(s=>s.actorId===vetId&&deaths.has(s.targetId)&&!protectedIds.has(s.targetId));
      if(earned) vet.veteranLostSecond=true;
    });

    // Capture before lastEffects, guiltDue, and alive flags change for the next night.
    const debugText=buildNightDebug({shots,protectedIds,activeVeterans,deaths,newGuilt});
    if(!Array.isArray(state.debugNights)) state.debugNights=[];
    state.debugNights=state.debugNights.filter(entry=>entry.night!==state.night);
    state.debugNights.push({night:state.night,text:debugText});
    state.players.forEach(p=>{
      const fx=effectFor(p.id);
      state.lastEffects[p.id]={blockOrWitch:fx.blocked||!!fx.witch,blackmail:fx.blackmailed};
    });
    deaths.forEach(id=>{ const p=byId(id); if(p) p.alive=false; });
    state.guiltDue={};
    Object.entries(newGuilt).forEach(([id,count])=>{ if(byId(id)?.alive) state.guiltDue[id]=count; });

    nightActions('lookout').forEach(a=>{
      const lookout=byId(a.actorId); if(!lookout?.alive) return;
      if(!Array.isArray(lookout.lookoutInbox)) lookout.lookoutInbox=[];
      lookout.lookoutInbox.push(visitorReport(a.targetId));
    });
    const deadPlayers=[...deaths].map(byId).filter(Boolean);
    state.nightResult={night:state.night,deaths:deadPlayers.map(p=>p.id)};
    state.nightState=null;
    const winner=checkWinner();
    if(winner) state.winner=winner;
    state.mode='nightResult';
    render();
  }
  function checkWinner() {
    const mafia=alive().filter(isMafia).length, town=alive().filter(p=>!isMafia(p)).length;
    if(mafia===0&&town===0) return 'Tie';
    if(mafia===0) return 'Town';
    if(town===0) return 'Mafia';
    return null;
  }

    main(`<p class="eyebrow">Dawn after Night ${state.nightResult.night}</p><h1>${dead.length?'The town wakes to loss.':'The town wakes intact.'}</h1>

      <div class="actions"><button class="btn primary wide" onclick="${state.winner?'Game.showGameOver()':'Game.beginDay()'}">${state.winner?'Reveal game result':`Begin Day ${state.night}`}</button></div>`,'Dawn');
  }

    main(`<p class="eyebrow">Day ${state.night}</p><h1>Open the floor.</h1><p class="lead">The living players may deliberate. When voting begins, show the GM each player’s available voting power and let the GM confirm the result.</p>
      <div class="panel"><div class="roster">${state.players.map(p=>`<div class="roster-row ${p.alive?'':'dead'}"><strong>${esc(p.name)}</strong><span class="tag ${p.alive?'green':''}">${p.alive?'Alive':'Dead'}</span></div>`).join('')}</div>

  function assignedExtrasFor(id) { return byId(id)?.alive ? state.players.filter(p=>p.role==='Aristocrat'&&p.aristocratRecipient===id).length : 0; }
  function auditCount(id) { return state.dayAuditTargets.filter(x=>x===id).length; }
  function availableVoteCount(p) {
    let total=1+assignedExtrasFor(p.id), audits=auditCount(p.id);

  function renderVoting() {

  function renderGameOver() {
    const title=state.winner==='Tie'?'The game ends in a tie.':`${state.winner} wins.`;
    main(`<div class="hero"><p class="eyebrow">Game over</p><h1>${esc(title)}</h1><p class="lead">The final result is official. Roles may now be revealed around the table.</p></div>
      <div class="panel"><div class="roster">${state.players.map(p=>`<div class="roster-row"><div><strong>${esc(p.name)}</strong><div style="color:var(--muted)">${p.alive?'Survived':'Died'}</div></div>${roleBadge(p.role)}</div>`).join('')}</div><div class="actions"><button class="btn primary wide" onclick="Game.resetGame()">Set up another game</button></div></div>`,'Game over');
  }

  function adjustPlayers(delta) {
    const s=state.setup, next=Math.max(7,Math.min(19,s.count+delta));
    s.count=next;
    while(s.names.length<next) s.names.push(`Player ${s.names.length+1}`);
    const defaults=defaultSeats(next);
    while(s.seats.length<next) s.seats.push(defaults[s.seats.length]);
    s.seats=s.seats.slice(0,next);
    if(s.cards.length>next) s.cards=s.cards.slice(0,next);
    render();
  }
  function setName(index,value) {
    state.setup.names[index]=value;
    const label=document.querySelector(`[data-seat-index="${index}"] .seat-name`);
    if(label) label.textContent=value||`Player ${index+1}`;
    refreshSetupValidity();
    saveState();
  }
  function adjustTableDimension(axis,delta) {
    const s=state.setup;
    if(axis==='width') s.tableWidth=Math.max(38,Math.min(68,s.tableWidth+delta));
    if(axis==='height') s.tableHeight=Math.max(24,Math.min(58,s.tableHeight+delta));
    render();
  }
  function resetSeatPositions() { state.setup.seats=defaultSeats(state.setup.count); render(); }
  function startSeatDrag(event,index) {
    if(state.mode!=='setup') return;
    draggingSeatIndex=index; event.currentTarget.classList.add('dragging');
    try{event.currentTarget.setPointerCapture(event.pointerId);}catch{}
    moveSeatDrag(event,index); event.preventDefault();
  }
  function moveSeatDrag(event,index) {
    if(draggingSeatIndex!==index||state.mode!=='setup') return;
    const map=event.currentTarget.closest('[data-table-map]'); if(!map) return;
    const rect=map.getBoundingClientRect(), x=(event.clientX-rect.left)/rect.width*100, y=(event.clientY-rect.top)/rect.height*100;
    const s=state.setup, halfW=s.tableWidth/2, halfH=s.tableHeight/2, gap=10;
    const candidates=[
      {side:'top',dist:Math.abs(y-(50-halfH-gap)),pos:(x-(50-halfW))/s.tableWidth},
      {side:'right',dist:Math.abs(x-(50+halfW+gap)),pos:(y-(50-halfH))/s.tableHeight},
      {side:'bottom',dist:Math.abs(y-(50+halfH+gap)),pos:((50+halfW)-x)/s.tableWidth},
      {side:'left',dist:Math.abs(x-(50-halfW-gap)),pos:((50+halfH)-y)/s.tableHeight}
    ];
    const nearest=candidates.sort((a,b)=>a.dist-b.dist)[0];
    s.seats[index]={side:nearest.side,pos:Math.max(.04,Math.min(.96,nearest.pos))};
    const point=seatCoordinates(s.seats[index],s.tableWidth,s.tableHeight);
    event.currentTarget.style.left=point.x+'%'; event.currentTarget.style.top=point.y+'%';
    event.preventDefault();
  }
  function endSeatDrag(event,index) {
    if(draggingSeatIndex!==index) return;
    moveSeatDrag(event,index); draggingSeatIndex=null; event.currentTarget.classList.remove('dragging'); saveState();
    try{event.currentTarget.releasePointerCapture(event.pointerId);}catch{}
  }
  function toggleSetupCard(card) {
    const cards=state.setup.cards, index=cards.indexOf(card);
    if(index>=0) cards.splice(index,1);
    else if(cards.length<state.setup.count) cards.push(card);
    render();
  }
  function openReveal() { state.revealOpen=true; render(); }
  function nextReveal() {
    state.revealOpen=false; state.revealIndex++;
    if(state.revealIndex>=state.players.length) startNight(); else render();
  }
  function showGameOver() { state.mode='gameOver'; render(); }
  function requestPlayerSelection(action,id) {
    const allowed=['Game.chooseCardHolder','Game.chooseSuccessor','Game.chooseRoleTarget','Game.chooseWitchControlled','Game.chooseWitchForced','Game.selectElimination'];
    const p=byId(id);
    if(!p||!allowed.includes(action)) return;
    pendingPlayerSelection={action,id};
    render();
  }
  function cancelPlayerConfirmation() {
    pendingPlayerSelection=null;
    render();
  }
  function confirmPlayerSelection() {
    const selection=pendingPlayerSelection;
    if(!selection) return;
    pendingPlayerSelection=null;
    const handlers={
      'Game.chooseCardHolder':chooseCardHolder,
      'Game.chooseSuccessor':chooseSuccessor,
      'Game.chooseRoleTarget':chooseRoleTarget,
      'Game.chooseWitchControlled':chooseWitchControlled,
      'Game.chooseWitchForced':chooseWitchForced,
      'Game.selectElimination':selectElimination
    };
    handlers[selection.action]?.(selection.id);
  }
  function menuMarkup(confirming=false) {
    if(confirming) return `<div class="dialog-body"><p class="eyebrow">Confirm reset</p><h2>End this game?</h2><p class="lead">The current roles, actions, and history will be erased from this device.</p><div class="actions"><button class="btn" onclick="Game.openMenu()">Keep playing</button><button class="btn danger" onclick="Game.resetGame()">Erase & start over</button></div></div>`;
    return `<div class="dialog-body"><p class="eyebrow">Game menu</p><h2>Pause the table</h2><p class="lead">Your game saves automatically on this device.</p><div class="actions"><button class="btn" onclick="Game.closeMenu()">Return to game</button><button class="btn" onclick="Game.openDebug()">Night debug log</button><button class="btn danger" onclick="Game.confirmReset()">Start a new game</button></div></div>`;
  }
  function openMenu() { const d=document.getElementById('menuDialog'); d.innerHTML=menuMarkup(false); if(!d.open)d.showModal(); }
  function closeMenu() { document.getElementById('menuDialog').close(); }
  function confirmReset() { document.getElementById('menuDialog').innerHTML=menuMarkup(true); }
  function goBack() {
    if(!undoHistory.length) return;
    try{document.getElementById('menuDialog').close();}catch{}
    pendingPlayerSelection=null;
    const snapshot=undoHistory.pop();
    state=JSON.parse(snapshot); renderedSnapshot=snapshot; restoringState=true; render();
  }
  function resetGame() {
    try{document.getElementById('menuDialog').close();}catch{}
    pendingPlayerSelection=null;
    localStorage.removeItem(STORAGE_KEY); undoHistory=[]; state=freshState(); renderedSnapshot=JSON.stringify(state); restoringState=true; render();
  }

  window.Game={
    adjustPlayers,setName,setNecronomicon,setRoleEnabled,setRoleGuarantee,adjustTableDimension,resetSeatPositions,startSeatDrag,moveSeatDrag,endSeatDrag,toggleSetupCard,chooseCardHolder,createGame,openReveal,nextReveal,startNight,
    chooseSuccessor,advanceNight,beginPrivateActor,chooseRoleTarget,chooseWitchControlled,chooseWitchForced,cancelWitchDraft,
    activateVeteran,skipActions,completeActor:advanceAfterActor,resolveNight,beginDay,beginVoting,
    selectElimination,confirmElimination,confirmNoElimination,nextNight,showGameOver,
    requestPlayerSelection,confirmPlayerSelection,cancelPlayerConfirmation,
    goBack,openMenu,openDebug,closeMenu,confirmReset,resetGame
  };

  function registerWebMCP() {
    const context=document.modelContext;
    if(!context?.registerTool) return;
    try {
      context.registerTool({
        name:'get_mafia_game_status',
        title:'Get Mafia game status',
        description:'Read the current public phase, night number, living-player count, and whether the game has ended. Does not reveal hidden roles or private actions.',
        inputSchema:{type:'object',properties:{},additionalProperties:false},
        annotations:{readOnlyHint:true,untrustedContentHint:false},
        execute(input){
          if(input===null||typeof input!=='object'||Array.isArray(input)||Object.keys(input).length) throw new Error('This tool does not accept input fields.');
          return {phase:state.mode,night:state.night,livingPlayers:alive().length,totalPlayers:state.players.length,winner:state.winner};
        }
      });
    } catch {}
  }
  registerWebMCP();
  render();
  </script>
</body>
</html>
